name: build-publish-deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --frozen
      - run: uv run pytest

  publish:
    runs-on: docker
    needs: test
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE=192.168.0.194:30500/coilysiren-backend:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: report status to datastore
        if: always()
        env:
          DATASTORE_TOKEN: ${{ secrets.DATASTORE_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST http://api/document \
            -H "Authorization: Bearer $DATASTORE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg repo "$REPO" \
              --arg commit "$COMMIT" \
              --arg status "$STATUS" \
              --arg run_url "$RUN_URL" \
              '{namespace:"ci-status", key:($repo+"@"+$commit), payload:{repo:$repo, commit:$commit, status:$status, run_url:$run_url}}')" \
            || echo "datastore status report failed (non-fatal)"

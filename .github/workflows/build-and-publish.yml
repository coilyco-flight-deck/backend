name: build-publish-deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # OIDC tailnet join. GitHub mints a short-lived token, Tailscale
      # verifies it against the per-repo federated identity in
      # infrastructure/terraform/tailscale-oidc/. No kubeconfig and no
      # GHCR in CI - the image is built here, docker-saved, and streamed
      # into kai-server's k3s containerd over an SSH tunnel. Pattern
      # mirrors coilysiren/galaxy-gen and coilysiren/repo-recall; it
      # sidesteps the cluster-side registry pull entirely.
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          use-cache: "true"
          hostname: github-actions-${{ github.run_id }}
      # Build the image, save it to a tarball, pipe it over tailscale
      # ssh into kai-server's containerd, then roll the deployment.
      #
      # The ref is fully qualified (ghcr.io/...) even though nothing is
      # ever pushed to a registry. kubelet canonicalizes a bare name to
      # docker.io/library/<name>, which would not match the ref
      # containerd stored on import - the lookup misses and kubelet
      # falls through to a real docker.io pull that 404s. A fully
      # qualified ref is a no-op under canonicalization, so the
      # IfNotPresent lookup hits the sideloaded image. See repo-recall#219.
      - name: Build, ship, roll
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/coilysiren/coilysiren-backend:${{ github.sha }}
          name=coilysiren-backend make .build-docker
          docker tag coilysiren-backend:latest "$IMAGE"
          docker save "$IMAGE" | \
            tailscale ssh deploy@kai-server \
              "sudo k3s ctr -n k8s.io images import -"
          tailscale ssh deploy@kai-server \
            "kubectl -n coilysiren-backend set image deploy/coilysiren-backend-app coilysiren-backend=$IMAGE"
          tailscale ssh deploy@kai-server \
            "kubectl -n coilysiren-backend rollout status deploy/coilysiren-backend-app --timeout=5m"
      # Write build/deploy status into the document mode. This job is
      # tailnet-joined, so it POSTs to the internal host `api` (no public
      # ingress). The Mac-side poller reads namespace=ci-status,
      # key=<repo>@<commit> and renders a local notification.
      # See coilysiren/backend#65, coilysiren/backend#77.
      - name: report status to datastore
        if: always()
        env:
          DATASTORE_TOKEN: ${{ secrets.DATASTORE_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST http://api/document \
            -H "Authorization: Bearer $DATASTORE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg repo "$REPO" \
              --arg commit "$COMMIT" \
              --arg status "$STATUS" \
              --arg run_url "$RUN_URL" \
              '{namespace:"ci-status", key:($repo+"@"+$commit), payload:{repo:$repo, commit:$commit, status:$status, run_url:$run_url}}')"

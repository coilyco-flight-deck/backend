# Per-repo command allowlist for backend. ward is the canonical entry
# point for dev verbs here; the lockdown denies bare uv/docker invocations,
# so operators (human or agent) type `ward exec <verb>`, not `make build-native`.
#
# Names follow ward's [a-z0-9-] rule. Argv validation rejects shell
# metacharacters at invocation time, so flags forward verbatim through
# ward's user-extras mechanism.

commands:
  build-native:
    run: make build-native
    description: uv lock + uv sync.
  build-docker:
    run: make build-docker
    description: Build the docker image locally with BuildKit cache.
  deploy:
    run: make deploy
    description: Apply the k8s manifest to the cluster.
  run-native:
    run: make run-native
    description: Run the FastAPI server with autoreload on port 4000.
  run-docker:
    run: make run-docker
    description: Run the published container locally on port 4000.
  test:
    run: make test
    description: Run the pytest suite.

catalog:
  kind: Component
  type: service
  system: shared
  owner: kai
  lifecycle: production
  description: "Generic data-accessibility framework - internal FastAPI over Postgres, uniform modes for document, queue, sql, file, health."
  dependsOn: []

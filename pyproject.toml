[project]
name = "backend"
version = "0"
description = ""
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.135.3,<0.136.0",
  "fastapi-mcp>=0.4.0,<1.0.0",
  "uvicorn[standard]>=0.44.0,<0.45.0",
  "python-dotenv>=1.2.2,<2.0.0",
  "slowapi>=0.1.9,<0.2.0",
  "asyncpg>=0.30.0,<0.31.0",
  "requests>=2.32.0,<3.0.0",
  "structlog>=25.5.0,<26.0.0",
  "pyyaml>=6.0.3,<7.0.0",
  "opentelemetry-instrumentation>=0.62b0,<0.63",
  "opentelemetry-distro>=0.62b0,<0.63",
  "opentelemetry-exporter-otlp>=1.41.0,<2.0.0",
  "opentelemetry-api>=1.41.0,<2.0.0",
  "sentry-sdk[fastapi]>=2.58.0,<3.0.0",
  "opentelemetry-instrumentation-fastapi>=0.62b0,<0.63",
  "otel-a2a-relay-channels",
]

[tool.uv.sources]
otel-a2a-relay-channels = { git = "https://github.com/coilyco-flight-deck/otel-a2a-relay.git", subdirectory = "channels" }

[dependency-groups]
dev = [
  "ruff>=0.15.10,<0.16.0",
  "mypy>=1.20.1,<2.0.0",
  "ptipython>=1.0.1,<2.0.0",
  "notebook>=7.5.6,<8.0.0",
  "types-requests>=2.33.0.20260408,<3.0.0",
  "types-pyyaml>=6.0.0,<7.0.0",
  "pytest>=9.0.3,<10.0.0",
  "pytest-asyncio>=1.0.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are designed to be called in
# argument defaults; that is not the B008 antipattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.security.HTTPBearer"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pyright]
venvPath = "."
venv = ".venv"

# .pre-commit-config.yaml carries the agentic-os managed block's BEGIN/END
# marker comments, which apply-agentic-os-hooks.py needs to find its block.
# Those are generated structural markers, so the file is excluded rather than
# stripped. Deploy YAML rationale moved to docs/deploy.md (backend#33).
[tool.agentic-os.code-comments]
excludes = [
    ".pre-commit-config.yaml",
]

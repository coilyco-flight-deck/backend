apiVersion: v1
kind: Namespace
metadata:
  name: ${NAME}
---
# No GHCR pull-secret. The image is built in CI, docker-saved, and
# streamed into kai-server's k3s containerd over tailscale ssh (see
# .github/workflows/build-and-publish.yml). The cluster never pulls
# from a registry, so there is no imagePullSecret to sync.
#
# Postgres password for the ambient datastore. Backs both the Postgres
# StatefulSet (POSTGRES_PASSWORD) and the app's asyncpg pool (PGPASSWORD).
# /coilysiren/backend/db-password lives in AWS SSM (SecureString).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-db
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-db
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /coilysiren/backend/db-password
---
# Bearer token for every mode route. The app validates it via
# backend/datastore.py's require_token dependency. The CI release pipeline
# and the Mac-side poller send it. /coilysiren/backend/datastore-token
# lives in AWS SSM (SecureString).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-datastore-token
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-datastore-token
    creationPolicy: Owner
  data:
    - secretKey: DATASTORE_TOKEN
      remoteRef:
        key: /coilysiren/backend/datastore-token
---
# Sentry DSN for this service, synced from AWS SSM via external-secrets.
# Consumed by backend/telemetry.py's `sentry_sdk.init(dsn=os.getenv("SENTRY_DSN"))`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-sentry
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-sentry
    creationPolicy: Owner
  data:
    - secretKey: SENTRY_DSN
      remoteRef:
        key: /sentry-dsn/backend
---
# Tailnet device for this service. Auth key minted by
# terraform/tailscale-devices/ in coilysiren/infrastructure under the
# short name `backend`; lands in SSM at /coilysiren/backend/ts-authkey
# and the ExternalSecret below materializes it into the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${NAME}-ts
  namespace: ${NAME}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${NAME}-ts-state
  namespace: ${NAME}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ts-state", "ts-state-db"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${NAME}-ts-state
  namespace: ${NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${NAME}-ts-state
subjects:
  - kind: ServiceAccount
    name: ${NAME}-ts
    namespace: ${NAME}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ts-authkey
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ts-authkey
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        authkey: "{{ .authkey }}"
  data:
    - secretKey: authkey
      remoteRef:
        key: /coilysiren/backend/ts-authkey
---
# Tailnet auth key for the db Pod's ts sidecar. Minted by
# terraform/tailscale-devices/ in coilysiren/infrastructure under the
# name backend-db; lands in SSM at /coilysiren/backend-db/ts-authkey.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ts-authkey-db
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ts-authkey-db
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        authkey: "{{ .authkey }}"
  data:
    - secretKey: authkey
      remoteRef:
        key: /coilysiren/backend-db/ts-authkey
---
# Headless Service for the Postgres StatefulSet's pod-DNS. The app reaches
# the database at `${NAME}-db` inside the namespace. Same pattern as the
# forgejo deploy in coilysiren/infrastructure.
apiVersion: v1
kind: Service
metadata:
  name: ${NAME}-db
  namespace: ${NAME}
  labels:
    app: ${NAME}-db
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: ${NAME}-db
---
# pg_hba.conf for the Postgres StatefulSet. Trust on the tailnet: the db
# Pod joins the tailnet via the ts sidecar, and the Tailscale ACL already
# limits tag:k8s nodes to user member devices, so a tailnet connection is
# already an authenticated one. In-cluster traffic (the app, pod CIDR
# 10.42.0.0/16) keeps password auth. See backend#79.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${NAME}-db-hba
  namespace: ${NAME}
data:
  pg_hba.conf: |
    local   all   all                         trust
    host    all   all   127.0.0.1/32          trust
    host    all   all   ::1/128               trust
    host    all   all   100.64.0.0/10         trust
    host    all   all   fd7a:115c:a1e0::/48   trust
    host    all   all   10.42.0.0/16          scram-sha-256
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${NAME}-db
  namespace: ${NAME}
spec:
  serviceName: ${NAME}-db
  replicas: 1
  selector:
    matchLabels:
      app: ${NAME}-db
  template:
    metadata:
      labels:
        app: ${NAME}-db
    spec:
      serviceAccountName: ${NAME}-ts
      nodeSelector:
        kubernetes.io/hostname: kai-server
      containers:
        - name: postgres
          image: postgres:17
          # Custom hba_file outside PGDATA - trust on the tailnet, password
          # in-cluster. See the ${NAME}-db-hba ConfigMap and backend#79.
          args: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: backend
            - name: POSTGRES_USER
              value: backend
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-db
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: pg-hba
              mountPath: /etc/postgresql
              readOnly: true
        # tailscale sidecar in kernel mode - puts the db Pod on the tailnet
        # as `backend-db` so desktop DB clients reach it directly. Auth key
        # minted by terraform/tailscale-devices/ under the name backend-db.
        - name: ts
          image: tailscale/tailscale:v1.78.1
          env:
            - name: TS_HOSTNAME
              value: backend-db
            - name: TS_KUBE_SECRET
              value: ts-state-db
            - name: TS_USERSPACE
              value: "false"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: "--accept-dns=false"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: ts-authkey-db
                  key: authkey
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: pg-hba
          configMap:
            name: ${NAME}-db-hba
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Ambient KV store of small JSON docs - single-digit MB in
            # practice. 1Gi is already generous.
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${NAME}-app
  namespace: ${NAME}
  labels:
    app: ${NAME}-app
spec:
  selector:
    matchLabels:
      app: ${NAME}-app
  template:
    metadata:
      labels:
        app: ${NAME}-app
    spec:
      serviceAccountName: ${NAME}-ts
      # /dev/net/tun for the ts sidecar lives on kai-server (native
      # Linux 6.8); WSL2 nodes don't expose it.
      nodeSelector:
        kubernetes.io/hostname: kai-server
      containers:
        - name: ${NAME}
          image: ${IMAGE}
          # The image is sideloaded into containerd by CI; never pull
          # it. The ref is ghcr.io-shaped only so kubelet's lookup
          # matches the imported ref - nothing is pushed there.
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          env:
            - name: PORT
              value: "80"
            - name: PRODUCTION
              value: "true"
            - name: PGHOST
              value: ${NAME}-db
            - name: PGUSER
              value: backend
            - name: PGDATABASE
              value: backend
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-db
                  key: DB_PASSWORD
            - name: DATASTORE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-datastore-token
                  key: DATASTORE_TOKEN
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-sentry
                  key: SENTRY_DSN
            # Temp-tier file storage for the `file` mode. Backed by the
            # ephemeral emptyDir below - write-only, gone on Pod restart.
            - name: FILE_TEMP_DIR
              value: /data/temp
          volumeMounts:
            - name: file-temp
              mountPath: /data/temp
          ports:
            - containerPort: 80
        # tailscale sidecar in kernel mode. Same pattern as canary
        # repo-recall (coilysiren/infrastructure#201) and eco-mcp-app.
        - name: ts
          image: tailscale/tailscale:v1.78.1
          env:
            - name: TS_HOSTNAME
              value: api
            - name: TS_KUBE_SECRET
              value: ts-state
            - name: TS_USERSPACE
              value: "false"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: "--accept-dns=false"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: ts-authkey
                  key: authkey
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Always
      # Ephemeral temp tier for the `file` mode. emptyDir - lives and dies
      # with the Pod, no durable tier in v1.
      volumes:
        - name: file-temp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: ${NAME}-service
  namespace: ${NAME}
spec:
  type: ClusterIP
  selector:
    app: ${NAME}-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
# No Ingress. The service is internal-only, reachable on the tailnet via the
# in-Pod Tailscale sidecar (TS_HOSTNAME=api). No public TLS, no cert-manager.

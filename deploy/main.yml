apiVersion: v1
kind: Namespace
metadata:
  name: ${NAME}
---
# GHCR pull-secret, synced declaratively from AWS SSM via the cluster's
# external-secrets operator. `/github/pat` is the shared PAT for ghcr.io/coilysiren
# and lives in AWS SSM Parameter Store (encrypted). ESO renders it into a
# kubernetes.io/dockerconfigjson secret, no manual kubectl create, no PAT
# materializing anywhere outside the cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-registry
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: docker-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "coilysiren:%s" .pat | b64enc }}"}}}
  data:
    - secretKey: pat
      remoteRef:
        key: /github/pat
---
# Bsky creds for the main account, needed by backend/bsky.py's
# client.login(BSKY_USERNAME, BSKY_PASSWORD) path. /bsky/handle and
# /bsky/password live in AWS SSM (see agentic-os-kai/AGENTS.md inventory).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-bsky
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-bsky
    creationPolicy: Owner
  data:
    - secretKey: BSKY_USERNAME
      remoteRef:
        key: /bsky/handle
    - secretKey: BSKY_PASSWORD
      remoteRef:
        key: /bsky/password
---
# Sentry DSN for this service, synced from AWS SSM via external-secrets.
# Consumed by backend/telemetry.py's `sentry_sdk.init(dsn=os.getenv("SENTRY_DSN"))`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-sentry
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-sentry
    creationPolicy: Owner
  data:
    - secretKey: SENTRY_DSN
      remoteRef:
        key: /sentry-dsn/backend
---
# Tailnet device for this service. Auth key minted by
# terraform/tailscale-devices/ in coilysiren/infrastructure under the
# short name `backend`; lands in SSM at /coilysiren/backend/ts-authkey
# and the ExternalSecret below materializes it into the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${NAME}-ts
  namespace: ${NAME}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${NAME}-ts-state
  namespace: ${NAME}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ts-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${NAME}-ts-state
  namespace: ${NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${NAME}-ts-state
subjects:
  - kind: ServiceAccount
    name: ${NAME}-ts
    namespace: ${NAME}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ts-authkey
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ts-authkey
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        authkey: "{{ .authkey }}"
  data:
    - secretKey: authkey
      remoteRef:
        key: /coilysiren/backend/ts-authkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${NAME}-app
  namespace: ${NAME}
  labels:
    app: ${NAME}-app
spec:
  selector:
    matchLabels:
      app: ${NAME}-app
  template:
    metadata:
      labels:
        app: ${NAME}-app
    spec:
      serviceAccountName: ${NAME}-ts
      # /dev/net/tun for the ts sidecar lives on kai-server (native
      # Linux 6.8); WSL2 nodes don't expose it.
      nodeSelector:
        kubernetes.io/hostname: kai-server
      imagePullSecrets:
        - name: docker-registry
      containers:
        - name: ${NAME}
          image: ${IMAGE}
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          env:
            - name: PORT
              value: "80"
            - name: PRODUCTION
              value: "true"
            - name: BSKY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-bsky
                  key: BSKY_USERNAME
            - name: BSKY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-bsky
                  key: BSKY_PASSWORD
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-sentry
                  key: SENTRY_DSN
          ports:
            - containerPort: 80
        # tailscale sidecar in kernel mode. Same pattern as canary
        # repo-recall (coilysiren/infrastructure#201) and eco-mcp-app.
        - name: ts
          image: tailscale/tailscale:v1.78.1
          env:
            - name: TS_HOSTNAME
              value: backend
            - name: TS_KUBE_SECRET
              value: ts-state
            - name: TS_USERSPACE
              value: "false"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: "--accept-dns=false"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: ts-authkey
                  key: authkey
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: ${NAME}-service
  namespace: ${NAME}
spec:
  type: ClusterIP
  selector:
    app: ${NAME}-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${NAME}-ingress
  namespace: ${NAME}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    kubernetes.io/tls-acme: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${DNS_NAME}
      secretName: ${NAME}-tls
  rules:
    - host: ${DNS_NAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${NAME}-service
                port:
                  number: 80

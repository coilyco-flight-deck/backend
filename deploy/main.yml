apiVersion: v1
kind: Namespace
metadata:
  name: ${NAME}
---
# GHCR pull-secret, synced declaratively from AWS SSM via the cluster's
# external-secrets operator. `/github/pat` is the shared PAT for ghcr.io/coilysiren
# and lives in AWS SSM Parameter Store (encrypted). ESO renders it into a
# kubernetes.io/dockerconfigjson secret, no manual kubectl create, no PAT
# materializing anywhere outside the cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-registry
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: docker-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "coilysiren:%s" .pat | b64enc }}"}}}
  data:
    - secretKey: pat
      remoteRef:
        key: /github/pat
---
# Postgres password for the ambient datastore. Backs both the Postgres
# StatefulSet (POSTGRES_PASSWORD) and the app's asyncpg pool (PGPASSWORD).
# /coilysiren/backend/db-password lives in AWS SSM (SecureString).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-db
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-db
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /coilysiren/backend/db-password
---
# Bearer token for the /items CRUD routes. The app validates it via
# backend/datastore.py's require_token dependency; the CI release pipeline
# and the Mac-side poller send it. /coilysiren/backend/datastore-token
# lives in AWS SSM (SecureString).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-datastore-token
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-datastore-token
    creationPolicy: Owner
  data:
    - secretKey: DATASTORE_TOKEN
      remoteRef:
        key: /coilysiren/backend/datastore-token
---
# Sentry DSN for this service, synced from AWS SSM via external-secrets.
# Consumed by backend/telemetry.py's `sentry_sdk.init(dsn=os.getenv("SENTRY_DSN"))`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-sentry
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-sentry
    creationPolicy: Owner
  data:
    - secretKey: SENTRY_DSN
      remoteRef:
        key: /sentry-dsn/backend
---
# Tailnet device for this service. Auth key minted by
# terraform/tailscale-devices/ in coilysiren/infrastructure under the
# short name `backend`; lands in SSM at /coilysiren/backend/ts-authkey
# and the ExternalSecret below materializes it into the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${NAME}-ts
  namespace: ${NAME}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${NAME}-ts-state
  namespace: ${NAME}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ts-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${NAME}-ts-state
  namespace: ${NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${NAME}-ts-state
subjects:
  - kind: ServiceAccount
    name: ${NAME}-ts
    namespace: ${NAME}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ts-authkey
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ts-authkey
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        authkey: "{{ .authkey }}"
  data:
    - secretKey: authkey
      remoteRef:
        key: /coilysiren/backend/ts-authkey
---
# Headless Service for the Postgres StatefulSet's pod-DNS. The app reaches
# the database at `${NAME}-db` inside the namespace. Same pattern as the
# forgejo deploy in coilysiren/infrastructure.
apiVersion: v1
kind: Service
metadata:
  name: ${NAME}-db
  namespace: ${NAME}
  labels:
    app: ${NAME}-db
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: ${NAME}-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${NAME}-db
  namespace: ${NAME}
spec:
  serviceName: ${NAME}-db
  replicas: 1
  selector:
    matchLabels:
      app: ${NAME}-db
  template:
    metadata:
      labels:
        app: ${NAME}-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: kai-server
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: backend
            - name: POSTGRES_USER
              value: backend
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-db
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${NAME}-app
  namespace: ${NAME}
  labels:
    app: ${NAME}-app
spec:
  selector:
    matchLabels:
      app: ${NAME}-app
  template:
    metadata:
      labels:
        app: ${NAME}-app
    spec:
      serviceAccountName: ${NAME}-ts
      # /dev/net/tun for the ts sidecar lives on kai-server (native
      # Linux 6.8); WSL2 nodes don't expose it.
      nodeSelector:
        kubernetes.io/hostname: kai-server
      imagePullSecrets:
        - name: docker-registry
      containers:
        - name: ${NAME}
          image: ${IMAGE}
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          env:
            - name: PORT
              value: "80"
            - name: PRODUCTION
              value: "true"
            - name: PGHOST
              value: ${NAME}-db
            - name: PGUSER
              value: backend
            - name: PGDATABASE
              value: backend
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-db
                  key: DB_PASSWORD
            - name: DATASTORE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-datastore-token
                  key: DATASTORE_TOKEN
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-sentry
                  key: SENTRY_DSN
          ports:
            - containerPort: 80
        # tailscale sidecar in kernel mode. Same pattern as canary
        # repo-recall (coilysiren/infrastructure#201) and eco-mcp-app.
        - name: ts
          image: tailscale/tailscale:v1.78.1
          env:
            - name: TS_HOSTNAME
              value: backend
            - name: TS_KUBE_SECRET
              value: ts-state
            - name: TS_USERSPACE
              value: "false"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: "--accept-dns=false"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: ts-authkey
                  key: authkey
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: ${NAME}-service
  namespace: ${NAME}
spec:
  type: ClusterIP
  selector:
    app: ${NAME}-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${NAME}-ingress
  namespace: ${NAME}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    kubernetes.io/tls-acme: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${DNS_NAME}
      secretName: ${NAME}-tls
  rules:
    - host: ${DNS_NAME}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${NAME}-service
                port:
                  number: 80

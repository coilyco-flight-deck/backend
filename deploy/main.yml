apiVersion: v1
kind: Namespace
metadata:
  name: ${NAME}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: ${NAME}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: ${NAME}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: ${NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: ${NAME}
---
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: ${NAME}
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-db
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-db
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /coilysiren/backend/db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-datastore-token
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-datastore-token
    creationPolicy: Owner
  data:
    - secretKey: DATASTORE_TOKEN
      remoteRef:
        key: /coilysiren/backend/datastore-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${NAME}-sentry
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ${NAME}-sentry
    creationPolicy: Owner
  data:
    - secretKey: SENTRY_DSN
      remoteRef:
        key: /sentry-dsn/backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${NAME}-ts
  namespace: ${NAME}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${NAME}-ts-state
  namespace: ${NAME}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ts-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${NAME}-ts-state
  namespace: ${NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${NAME}-ts-state
subjects:
  - kind: ServiceAccount
    name: ${NAME}-ts
    namespace: ${NAME}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ts-authkey
  namespace: ${NAME}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ts-authkey
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        authkey: "{{ .authkey }}"
  data:
    - secretKey: authkey
      remoteRef:
        key: /coilysiren/backend/ts-authkey
---
apiVersion: v1
kind: Service
metadata:
  name: ${NAME}-db
  namespace: ${NAME}
  labels:
    app: ${NAME}-db
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: ${NAME}-db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${NAME}-db-hba
  namespace: ${NAME}
data:
  pg_hba.conf: |
    local   all   all                         trust
    host    all   all   127.0.0.1/32          trust
    host    all   all   ::1/128               trust
    host    all   all   10.42.0.0/16          scram-sha-256
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${NAME}-db
  namespace: ${NAME}
spec:
  serviceName: ${NAME}-db
  replicas: 1
  selector:
    matchLabels:
      app: ${NAME}-db
  template:
    metadata:
      labels:
        app: ${NAME}-db
    spec:
      serviceAccountName: ${NAME}-ts
      nodeSelector:
        kubernetes.io/hostname: kai-server
      containers:
        - name: postgres
          image: postgres:17
          args: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: backend
            - name: POSTGRES_USER
              value: backend
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-db
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: pg-hba
              mountPath: /etc/postgresql
              readOnly: true
      volumes:
        - name: pg-hba
          configMap:
            name: ${NAME}-db-hba
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${NAME}-app
  namespace: ${NAME}
  labels:
    app: ${NAME}-app
spec:
  selector:
    matchLabels:
      app: ${NAME}-app
  template:
    metadata:
      labels:
        app: ${NAME}-app
    spec:
      serviceAccountName: ${NAME}-ts
      nodeSelector:
        kubernetes.io/hostname: kai-server
      containers:
        - name: ${NAME}
          image: ${IMAGE}
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          env:
            - name: PORT
              value: "80"
            - name: PRODUCTION
              value: "true"
            - name: PGHOST
              value: ${NAME}-db
            - name: PGUSER
              value: backend
            - name: PGDATABASE
              value: backend
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-db
                  key: DB_PASSWORD
            - name: DATASTORE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-datastore-token
                  key: DATASTORE_TOKEN
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: ${NAME}-sentry
                  key: SENTRY_DSN
            - name: FILE_TEMP_DIR
              value: /data/temp
          volumeMounts:
            - name: file-temp
              mountPath: /data/temp
          ports:
            - containerPort: 80
        - name: ts
          image: tailscale/tailscale:v1.78.1
          env:
            - name: TS_HOSTNAME
              value: api
            - name: TS_KUBE_SECRET
              value: ts-state
            - name: TS_USERSPACE
              value: "false"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: "--accept-dns=false"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: ts-authkey
                  key: authkey
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Always
      volumes:
        - name: file-temp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: ${NAME}-service
  namespace: ${NAME}
spec:
  type: ClusterIP
  selector:
    app: ${NAME}-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
